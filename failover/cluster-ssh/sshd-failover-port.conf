# Dedicated failover/reconcile SSH transmission line (ADR-0033 failover-ssh-decouple).
# sshd listens on 22 (household admin, household NIC) AND 47222 (failover bulk push).
# The air-gap firewall (airgap.nft) closes 22 on wlp2s0 and allows ONLY 47222 from the peer,
# so the air-gap boundary has no general SSH — just the one dedicated reconcile line.
Port 22
Port 47222
