# Per-node build/flash manifest for the ESP32-C6 dehumidifier node (ADR-0020 / ADR-0026 / ADR-0041).
#
# Board-local, like edge/esp32c6-hvac/nodes.yaml and for the same reason: edge/esp32c6/nodes.yaml is
# the GAS fleet (every entry carries a `sensor:` chip select) and this board has no I2C lane.
#
#   sensor: "none"  — MANDATORY to state even when the answer is none. An omitted line must stay an
#                     error, or the gas fleet loses the cross-provisioning guard this manifest exists
#                     for (the 2026-07-05 cbed_c6 <- coffice_c6 mixup).
#   ota_host        — ha-2's air-gap leg. NB the dev box is 192.168.1.245 on this network.
#
#   python3 tools/enroll_node.py --node-id dehum_c6 --from-manifest --reuse \
#       --out edge/esp32c6-dehum/main/secrets.h
nodes:
  dehum_c6:
    mac: "A0:F2:62:85:6E:60"
    target: esp32c6
    sensor: "none"
    area: staging            # bench today; relocate via device_relocate once it is installed
    broker: "mqtt://192.168.1.200:1883"
    ota_host: "192.168.1.210"
