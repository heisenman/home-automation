# Levoit Office — Levoit Vital 200S unit. First unit (2026-06-27); registry device_id purifier_living_room.
# Thin per-device file: identity + this unit's OTA key; the purifier/network body is the shared package.
# Flash/build/OTA recipe: README.md. Programming header + wiring: levoit-vital200s-c3.common.yaml header.
substitutions:
  device_name: levoit-office
  friendly_name: Levoit Office
  wifi_ap_ssid: "levoit-office-fallback"
  rx_pin: GPIO18                 # C3-SOLO-1 -> Vital 200S MCU UART (tuct, tested) — NOT the flash pads
  tx_pin: GPIO19

packages:
  vital200s: !include levoit-vital200s-c3.common.yaml

ota:
  - platform: esphome
    password: !secret ota_password
