# Seeed reTerminal E1001 — BEACHHEAD (connectivity + onboard sensors; NO display yet).
# Board: ESP32-S3R8 (8MB octal PSRAM), 32MB flash (W25Q256). Panel: 7.5" mono 800x480, UC8179 (added later).
# Path proven by the fleet: minimal WiFi + OTA + captive_portal + MQTT(.210), prove it joins, THEN add the
# ePaper renderer over OTA. First flash is SERIAL (esphome run over /dev/ttyUSB0) — it overwrites SenseCraft
# (backed up to ~/e1001-sensecraft-factory.bin first). Everything after is OTA-iterable.
#
# Pins are schematic-confirmed (reTerminal_E1001_V1_2_SCH) + cross-checked against shipping ESPHome configs:
#   SHT4x  I2C0  SDA=GPIO19 SCL=GPIO20 @0x44        Battery  sense=GPIO1  enable=GPIO21  divider x2.0
#   Buttons GPIO3(green)/4/5   LED GPIO6   Buzzer GPIO45      (ePaper SPI: clk7/mosi9 cs10 dc11 rst12 busy13)
#   MAC a4:cb:8f:cf:46:e8

substitutions:
  device_name: e1001-bench          # rename to e1001-<area> when it's mounted
  friendly_name: "reTerminal E1001 (bench)"
  wifi_ap_ssid: "e1001-bench-fallback"
  bff_base_url: "http://192.168.0.210:8123"   # FastAPI BFF; read endpoints are open on the LAN (no auth on GET)
  edge_node: "e1001"                 # edge-node id for home/edge/<node>/event (rename per-area on deploy)
  ntp_server: "192.168.0.210"        # dictator = LAN time anchor (holdover source; router serves NTP once onboarded)
  timezone: "America/Los_Angeles"    # display wall-clock zone; change to the house zone
  # P4e deep-sleep RUNTIME hooks — no reflash to toggle. These are first-boot DEFAULTS only; thereafter the
  # Sleep Enable switch + Sleep Duration / Awake Grace numbers are MQTT-settable and PERSIST across sleeps.
  sleep_default: "false"            # DEV first-boot: never sleep -> OTA always reachable. Flip live over MQTT.
  sleep_dur_default_s: "900"        # 15 min timer cadence (battery/freshness knob), runtime-tunable
  grace_default_s: "25"             # awake window per wake (wifi + fetch + ~5s render + read), runtime-tunable
  # Battery profile BAKED DEFAULT (ADR-0024 §5 fallback when no profile is loaded/pushed). The LUT is
  # GENERATED — do not hand-edit; regenerate from a battprofile capture with:
  #   tools/e1001_profile.py e1001lut <capture.jsonl> --write-yaml e1001.yaml --write-json battery_profile_v1.json
  # A refined profile deploys as DATA over MQTT with NO reflash (like the D1001 ha_battery_profile_rt):
  #   tools/d1001_profile_push.py --node e1001-bench --from-json battery_profile_v1.json --push
  # Base frame = the loaded discharge leg (the load the panel reads under at a deep-sleep wake). v1 2026-07-05.
  batt_soc_lut: "3478, 3530, 3572, 3626, 3674, 3724, 3756, 3778, 3798, 3812, 3836, 3858, 3892, 3922, 3956, 3970, 3988, 3992, 4010, 4046, 4100"
  # State offsets (base-frame mV) — E1001 UNCHARACTERIZED, 0 = normalize is a no-op (footer reads loaded V,
  # which is what the LUT was fit against). Safety floors mirror the Li-ion knee; boot gate > run (inrush).
  prof_off_display_off: "0"
  prof_off_usb: "0"
  prof_off_charging: "0"
  prof_run_floor: "3450"
  prof_warn: "3520"
  prof_warn_clear: "3580"
  prof_boot_gate: "3600"
  prof_boot_release: "3700"
  prof_date: "2026-07-05"
  # ADR-0024 §3/§4/§6 safety policy. Thresholds REUSE the loaded profile's floors (g_run_floor_mv / g_warn_mv /
  # g_boot_gate_mv ...). B1 (schematic sheet 4): no firmware rail-kill — Q1/CJ3407 is gated by physical SW1 — so
  # §3 "hard-off" = deep-sleep-at-floor (paint CHARGE ME, e-ink holds it, long re-check). Boot-gate holds the
  # ePaper dark below the cold-start floor (the display inrush is the load being avoided).
  pp_debounce: "3"                  # consecutive sub-run-floor 10s samples before deep-sleep-at-floor (~30s)
  pp_recheck_s: "3600"              # deep-sleep re-check cadence while parked at the floor (1h)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 900                  # EARLIEST: block auto deep-sleep so OTA is always reachable. We enter sleep
      then:                          # EXPLICITLY at the end of the wake cycle (priority -200) and only if enabled.
        - deep_sleep.prevent: ds
    - priority: 600                  # NOT 800: at 800 the gpio output isn't constructed yet → turn_on no-ops →
      then:                          # rail never powered → ADC reads 0. 600 = after components, per the ref config.
        - output.turn_on: vbat_adc_en  # power the battery-sense divider (held on in beachhead; gated later)
    - priority: 500                  # battery-profile self-heal: if the restored LUT is ever corrupt (bad
      then:                          # persist / first boot race), revert to the baked default so SoC can't brick.
        - lambda: |-
            bool ok = id(g_soc_lut)[0] >= 2500 && id(g_soc_lut)[20] <= 4400;
            for (int i = 1; i < 21 && ok; i++) if (id(g_soc_lut)[i] <= id(g_soc_lut)[i - 1]) ok = false;
            if (!ok) {
              static const int dl[21] = {${batt_soc_lut}};
              for (int i = 0; i < 21; i++) id(g_soc_lut)[i] = dl[i];
              id(g_prof_version) = "v1"; id(g_prof_method) = "baked"; id(g_prof_pushed) = false;
              ESP_LOGW("battprof", "restored LUT invalid -> reverted to baked default");
            }
    - priority: 450                  # ADR-0024 §6 boot-gate: below the cold-start floor ON BATTERY, hold the ePaper
      then:                          # dark (its inrush is the load we're gating). Force one ADC sample first (vbat_adc_en
        - component.update: batt_v   # is on at pri 600). Safe default: if no reading / on wall, allow the display.
        - delay: 300ms
        - lambda: |-
            float bv = id(batt_v).state;
            if (std::isnan(bv)) return;
            int mv = (int)(bv * 1000.0f + 0.5f);
            if (!id(charger)->power_good() && mv < id(g_boot_gate_mv)) {
              id(g_pp_dark) = true;
              ESP_LOGW("battpp", "boot-gate: cell %dmV < gate %dmV on battery -> holding display DARK", mv, id(g_boot_gate_mv));
            }
    - priority: 400                  # RTC holdover: sync the system clock FROM the PCF85063T at boot (i2c + the rtc
      then:                          # component are up by now) so the pri-100 first frame already shows the wall clock.
        - pcf85063.read_time: rtc_time
    - priority: 250                  # profiler discharge-LOAD burners: one low-pri CPU spinner per core, each self-
      then:                          # gated on DISCHARGE + Prof Load Level>0. Captureless lambdas (-> TaskFunction_t);
        - lambda: |-                 # duty scales with level (lvl3 = full burn). Priority 1 so WiFi/BT (much higher) never starve.
            for (int core = 0; core < 2; core++) {
              xTaskCreatePinnedToCore(+[](void *) {
                const size_t N = 96 * 1024;                              // >L2 cache: forces real octal-PSRAM bus traffic
                uint8_t *buf = (uint8_t *) heap_caps_malloc(N, MALLOC_CAP_SPIRAM);
                uint32_t k = 0;
                for (;;) {
                  if (id(g_prof_state) == 1 && id(g_load_lvl) > 0) {
                    volatile float x = 1.0001f;
                    for (int i = 0; i < 60000; i++) x = x * 1.0000001f + 0.0000001f;   // FPU/core burn
                    if (buf) for (size_t i = 0; i < N; i += 16) buf[i] = (uint8_t)(k++);  // PSRAM-bus thrash
                    int lvl = id(g_load_lvl);
                    if (lvl >= 3) taskYIELD(); else vTaskDelay(pdMS_TO_TICKS(3 - lvl));
                  } else {
                    vTaskDelay(pdMS_TO_TICKS(200));   // idle when not discharging / load off
                  }
                }
              }, core ? "profburn1" : "profburn0", 3072, nullptr, 1, nullptr, core);
            }
    - priority: -100                 # after everything is up: one-shot draw (update_interval is 'never', ePaper style)
      then:                          # ...unless the boot-gate (pri 450) held us dark to avoid the display inrush.
        - if:
            condition: { lambda: 'return !id(g_pp_dark);' }
            then:
              - component.update: epaper
    - priority: -200                 # LAST: P4e Step 1 — read the buttons AFTER the display draw and settle time.
      then:                          # Held button at boot => "stay awake for OTA" (the escape hatch for Step 2's sleep).
        - delay: 300ms               # let the gpio binary_sensors publish their initial state before we read them
        - if:
            condition:
              lambda: 'return id(btn_green).state || id(btn_right).state || id(btn_left).state;'
            then:
              - lambda: 'id(g_stay_awake) = true;'
              - lambda: 'ESP_LOGW("ota", "BUTTON HELD AT BOOT -> STAY-AWAKE (OTA mode). Deep-sleep will be gated.");'
              - binary_sensor.template.publish: { id: ota_hold, state: true }
            else:
              - lambda: 'ESP_LOGI("ota", "no button held at boot -> normal wake (Step 2: would deep-sleep).");'
              - binary_sensor.template.publish: { id: ota_hold, state: false }
        # P4e Step 2 — battery-mode wake cycle. Same automation as the button check above (sequential, no race):
        # only sleeps if enabled AND no button held. In DEV (sleep_enable=false) this whole branch is skipped.
        - if:
            condition:
              lambda: 'return id(g_sleep_enable) && !id(g_stay_awake);'
            then:
              - button.press: fetch_spec         # wake -> fetch fresh spec + alerts (fetch_spec redraws the ePaper)
              - delay: !lambda 'return (uint32_t) id(g_awake_grace_s) * 1000;'  # runtime awake window (s->ms)
              - lambda: 'ESP_LOGW("sleep", "wake cycle done -> deep-sleep for %ds", id(g_sleep_dur_s));'
              - deep_sleep.allow: ds             # clear the boot-time prevent, then enter timer sleep
              - deep_sleep.enter:
                  id: ds
                  sleep_duration: !lambda 'return (uint32_t) id(g_sleep_dur_s) * 1000;'  # runtime cadence (s->ms)

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB                    # chip is 32MB (W25Q256) but >16MB OTA needs esp-idf experimental flag;
                                     # E1001 is [status,sensor] not a data node, so 8MB (OTA + fonts) is ample.
  framework:
    type: esp-idf

logger:
  level: DEBUG                       # rides to MQTT ${device_name}/debug while we verify; drop to INFO later
  hardware_uart: UART0               # this board's console is UART0→CH340 (/dev/ttyUSB0); S3 default (USB-JTAG)
                                     # goes to GPIO19/20 which are repurposed as I2C0 here → silent. Force UART0.

api:                                 # native ESPHome API (wifi logs + optional HA integration)

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${wifi_ap_ssid}"
    password: !secret fallback_ap_password

captive_portal:

time:                                # clock: PCF85063T RTC (coin-cell holdover) as the boot source + SNTP to correct.
  - platform: pcf85063               # RTC @0x51: read at boot (on_boot pri 400) so the FIRST ePaper frame has the
    id: rtc_time                     # wall clock INSTANTLY on wake — before WiFi/SNTP — and it survives battery removal.
    address: 0x51
    i2c_id: bus_i2c0
    timezone: "${timezone}"
    update_interval: never           # read once explicitly at boot; SNTP owns correction thereafter (no RTC-read stomp)
  - platform: sntp                   # LAN time authority (.210): corrects RTC drift + writes it back on each sync.
    id: sntp_time                    # renders guard on .is_valid(); the RTC keeps the system clock valid across sleeps.
    timezone: "${timezone}"
    servers:
      - ${ntp_server}
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: rtc_time

external_components:
  - source: components               # local: components/sy6974b (charger driver) + e1001_ui scaffold

mqtt:
  id: mqtt_client                    # referenced by the edge-node event publisher (home/edge/<node>/event)
  broker: 192.168.0.210              # dictator real IP (VIP .200 unreachable from CTWap_24g wifi)
  port: 1883
  on_connect:                        # re-assert the retained active-profile status on every (re)connect. The
    - delay: 5s                      # 5s settle: publishing INSIDE the connect callback races the client setup
    - script.execute: publish_profile   # and gets dropped — let MQTT fully come up first, then publish retained.
  # ADR-0024 §5 loadable battery profile — same cmd/profile protocol as the D1001 (profile_apply_task):
  #   "get"     -> republish the retained /profile status
  #   "default" -> revert to the baked-in default (baked ${...}) and clear the pushed flag
  #   <JSON>    -> validate (21-pt ascending LUT + ordered floors) -> hot-swap + persist -> ack applied/rejected
  on_message:
    - topic: ${device_name}/cmd/profile
      then:
        - lambda: |-
            if (x == "get") { id(publish_profile)->execute(); return; }
            if (x == "default") {
              static const int dl[21] = {${batt_soc_lut}};
              for (int i = 0; i < 21; i++) id(g_soc_lut)[i] = dl[i];
              id(g_off_display_off_mv) = ${prof_off_display_off}; id(g_off_usb_mv) = ${prof_off_usb};
              id(g_off_charging_mv) = ${prof_off_charging}; id(g_run_floor_mv) = ${prof_run_floor};
              id(g_warn_mv) = ${prof_warn}; id(g_warn_clear_mv) = ${prof_warn_clear};
              id(g_boot_gate_mv) = ${prof_boot_gate}; id(g_boot_release_mv) = ${prof_boot_release};
              id(g_prof_version) = "v1"; id(g_prof_date) = "${prof_date}"; id(g_prof_method) = "baked";
              id(g_prof_pushed) = false;
              id(mqtt_client)->publish("${device_name}/ack", std::string("{\"profile\":\"reset-to-default\"}"));
              id(publish_profile)->execute();
              id(epaper)->update();
              return;
            }
            // else: a pushed profile JSON. Extract into temporaries, validate, THEN commit (never half-apply).
            int tmp[21]; int nlut = 0;
            int od = 0, ou = 0, oc = 0, rf = 0, wm = 0, wc = 0, bg = 0, br = 0;
            std::string ver, dat, met, err;
            bool ok = json::parse_json(x, [&](JsonObject root) -> bool {
              ver = root["version"] | ""; if (ver.empty()) { err = "no version"; return false; }
              dat = root["date"] | ""; met = root["method"] | "";
              od = root["off_display_off_mv"] | 0; ou = root["off_usb_mv"] | 0; oc = root["off_charging_mv"] | 0;
              rf = root["run_floor_mv"] | 0; wm = root["warn_mv"] | 0; wc = root["warn_clear_mv"] | 0;
              bg = root["boot_gate_mv"] | 0; br = root["boot_release_mv"] | 0;
              JsonArray lut = root["lut"].as<JsonArray>();
              if (lut.isNull()) { err = "no lut"; return false; }
              for (JsonVariant v : lut) { if (nlut < 21) tmp[nlut] = v.as<int>(); nlut++; }
              if (nlut != 21) { err = "lut must be 21 pts"; return false; }
              for (int i = 1; i < 21; i++) if (tmp[i] <= tmp[i - 1]) { err = "lut not ascending"; return false; }
              if (!(rf <= wm && wm <= wc)) { err = "floors unordered"; return false; }
              if (bg > br) { err = "boot floors unordered"; return false; }
              return true;
            });
            char ack[96];
            if (!ok) {
              snprintf(ack, sizeof(ack), "{\"profile\":\"rejected\",\"err\":\"%s\"}",
                       err.empty() ? "bad json" : err.c_str());
              id(mqtt_client)->publish("${device_name}/ack", std::string(ack));
              ESP_LOGW("battprof", "rejected pushed profile: %s", err.empty() ? "bad json" : err.c_str());
              return;
            }
            for (int i = 0; i < 21; i++) id(g_soc_lut)[i] = tmp[i];
            id(g_off_display_off_mv) = od; id(g_off_usb_mv) = ou; id(g_off_charging_mv) = oc;
            id(g_run_floor_mv) = rf; id(g_warn_mv) = wm; id(g_warn_clear_mv) = wc;
            id(g_boot_gate_mv) = bg; id(g_boot_release_mv) = br;
            id(g_prof_version) = ver; id(g_prof_date) = dat;
            id(g_prof_method) = met.empty() ? std::string("pushed") : met;
            id(g_prof_pushed) = true;
            snprintf(ack, sizeof(ack), "{\"profile\":\"applied\",\"version\":\"%s\"}", ver.c_str());
            id(mqtt_client)->publish("${device_name}/ack", std::string(ack));
            ESP_LOGW("battprof", "applied profile %s (%s): lut %d..%d mV", ver.c_str(),
                     id(g_prof_method).c_str(), tmp[0], tmp[20]);
            id(publish_profile)->execute();
            id(epaper)->update();

# Edge-node event publisher (Stage 1). Reusable script: emits the canonical home/edge/<node>/event envelope
# (schema 1, kind:power). Called on real power_good transitions AND from the Test Edge buttons. Mirrors the
# D1001's power_ctx_publish (beachhead_main.c:597); the coordinator's event-reconcile consumes home/edge/+/event
# and rebalances coverage on relaying->false (rollup-ladder-and-replica-sync.md:190).
script:
  - id: publish_edge_event           # emits the envelope for id(g_pub_wall); caller sets g_pub_wall then executes
    then:
      - lambda: |-
          bool w = id(g_pub_wall);
          std::string p = std::string(
            "{\"schema\":1,\"node\":\"${edge_node}\",\"kind\":\"power\",\"ts\":\"\",\"state\":{\"on_wall\":")
            + (w ? "true" : "false")
            + ",\"relaying\":" + (w ? "true" : "false")   // relaying gated on wall power (BLE = Stage 2)
            + ",\"censusing\":false}}";                    // E1001 is not a recovery/census node (ADR-0019)
          id(mqtt_client)->publish("home/edge/${edge_node}/event", p, 1, true);
          ESP_LOGW("edge", "published home/edge/${edge_node}/event on_wall=%s", w ? "true" : "false");

  # ADR-0024 §5: publish the active battery profile RETAINED on ${device_name}/profile (mirrors the D1001's
  # publish_profile). Full schema + a `source` tag so tools/d1001_profile_push.py --get can read it back.
  - id: publish_profile
    then:
      - lambda: |-
          auto n = [](int v) { return std::to_string(v); };
          std::string j = "{\"version\":\"" + id(g_prof_version) + "\",\"date\":\"" + id(g_prof_date) +
            "\",\"method\":\"" + id(g_prof_method) + "\",\"source\":\"" +
            (id(g_prof_pushed) ? std::string("pushed") : std::string("default")) + "\"," +
            "\"off_display_off_mv\":" + n(id(g_off_display_off_mv)) + ",\"off_usb_mv\":" + n(id(g_off_usb_mv)) +
            ",\"off_charging_mv\":" + n(id(g_off_charging_mv)) + ",\"run_floor_mv\":" + n(id(g_run_floor_mv)) +
            ",\"warn_mv\":" + n(id(g_warn_mv)) + ",\"warn_clear_mv\":" + n(id(g_warn_clear_mv)) +
            ",\"boot_gate_mv\":" + n(id(g_boot_gate_mv)) + ",\"boot_release_mv\":" + n(id(g_boot_release_mv)) +
            ",\"lut\":[";
          for (int i = 0; i < 21; i++) { if (i) j += ","; j += n(id(g_soc_lut)[i]); }
          j += "]}";
          id(mqtt_client)->publish("${device_name}/profile", j, 1, true);   // qos1, retained
          ESP_LOGW("battprof", "published /profile %s source=%s", id(g_prof_version).c_str(),
                   id(g_prof_pushed) ? "pushed" : "default");

# battery_profiler (Module 2) — safety core. FAST loop (2s): while a discharge run is active, kick the charger
# watchdog (WD_RST) so HIZ holds, AND guard the floor — clear HIZ before brown-out so the ESP survives to recover.
# If THIS loop ever stops (crash/hang), the un-kicked watchdog expires (~40s) and the charger resets EN_HIZ->0 =
# hardware auto-recovery. Telemetry loop (5s) streams state to e1001-bench/battprofile for host capture (Module 3).
interval:
  # ADR-0024 §3/§4/§6 safety monitor. On-battery only (on wall = charging = safe -> inert during USB dev). The
  # lambda folds one reading into the state machine + sets intent flags; the if-blocks actuate (a bare lambda
  # can't call components). Thresholds come from the loaded profile's floors (g_*_mv), so this holds pre-curve.
  - interval: 10s
    then:
      - lambda: |-
          float bv = id(batt_v).state;
          if (std::isnan(bv)) return;
          int mv = (int)(bv * 1000.0f + 0.5f);
          bool wall = id(charger)->power_good();
          // recover a boot-gate dark hold once charging or climbed past the release floor
          if (id(g_pp_dark) && (wall || mv >= id(g_boot_release_mv))) { id(g_pp_dark) = false; id(g_pp_do_redraw) = true; }
          if (wall) {                                   // plugged/charging: safe -> clear warn, reset streak
            id(g_pp_low_streak) = 0;
            if (id(g_pp_warned)) { id(g_pp_warned) = false; id(g_pp_do_redraw) = true; }
            return;
          }
          if (mv <= id(g_warn_mv) && !id(g_pp_warned)) { id(g_pp_warned) = true; id(g_pp_do_warn) = true; }
          else if (mv >= id(g_warn_clear_mv) && id(g_pp_warned)) { id(g_pp_warned) = false; id(g_pp_do_redraw) = true; }
          if (mv <= id(g_run_floor_mv)) { if (++id(g_pp_low_streak) >= ${pp_debounce}) id(g_pp_do_shutdown) = true; }
          else                         { id(g_pp_low_streak) = 0; }
      - if:
          condition: { lambda: 'return id(g_pp_do_warn) || id(g_pp_do_redraw);' }
          then:
            - lambda: 'id(g_pp_do_warn) = false; id(g_pp_do_redraw) = false;'
            - component.update: epaper
      - if:
          condition: { lambda: 'return id(g_pp_do_shutdown);' }
          then:
            - lambda: |-
                id(g_pp_do_shutdown) = false; id(g_pp_charge_me) = true;
                ESP_LOGW("battpp", "run floor reached on battery -> CHARGE ME + deep-sleep-at-floor %ds", ${pp_recheck_s});
            - component.update: epaper                 # paint CHARGE ME once; e-ink then holds it at ~0 power
            - deep_sleep.allow: ds
            - deep_sleep.enter: { id: ds, sleep_duration: !lambda 'return (uint32_t) ${pp_recheck_s} * 1000;' }
  - interval: 1s                     # external discharge-load gate: ON only while DISCHARGE + Prof Load Level>0, OFF
    then:                            # in every other state (so it can never fight the charge leg or over-drain at rest).
      - lambda: |-
          if (id(g_prof_state) == 1 && id(g_load_lvl) > 0) id(ext_load)->turn_on();
          else                                              id(ext_load)->turn_off();
  - interval: 10ms                   # profiler discharge-LOAD (radio): at Prof Load Level>=2, keep the WiFi PA near-
    then:                            # continuously TX'ing — a fat 1400B publish every 10ms (~140 KB/s). The PA is the
      - lambda: |-                   # biggest single current lever on the S3; sipping (256B/100ms) barely keyed it.
          if (id(g_prof_state) != 1 || id(g_load_lvl) < 2) return;
          static const std::string pay(1400, 'x');
          id(mqtt_client)->publish("${device_name}/loadgen", pay);   // std::string overload (avoid the char*,len trap)
  - interval: 2s
    then:
      - lambda: |-
          if (id(g_prof_state) == 0) return;          // IDLE: no kick -> WD free to reset-to-default (safe)
          id(charger)->kick_watchdog();               // hold register config for ANY active cycle state
          if (id(g_prof_state) == 1) {                // DISCHARGE: floor-gate = safety AND end-of-discharge
            float v = id(batt_v).state;
            if (!std::isnan(v) && v <= id(g_v_floor)) {
              id(ext_load)->turn_off();                // drop the external load AT the floor (don't wait for the 1s gate)
              id(charger)->set_hiz(false);            // recover to USB
              id(charger)->set_charge_enable(false);  // rest (no charge yet) for a clean OCV
              id(g_prof_state) = 2; id(g_state_ms) = millis();   // -> REST_D
              ESP_LOGW("prof", "V %.3f <= floor %.3f -> HIZ off -> REST_D", v, id(g_v_floor));
            }
          }
  - interval: 5s
    then:
      - lambda: |-
          uint32_t now = millis();
          int st = id(g_prof_state);
          if (st == 2) {                               // REST_D: settle -> measure OCV -> CHARGE
            if (now - id(g_state_ms) >= (uint32_t) id(g_rest_s) * 1000) {
              id(g_ocv_d) = id(batt_v).state;
              id(g_charge_mah) = 0;
              id(charger)->set_hiz(false);
              id(charger)->set_charge_enable(true);
              id(g_prof_state) = 3; id(g_state_ms) = now;
              ESP_LOGW("prof", "REST_D done OCV=%.3f -> CHARGE", id(g_ocv_d));
            }
          } else if (st == 3) {                        // CHARGE: coulomb-count fast-charge; done -> REST_C
            if (id(charger)->charge_status() == 2) id(g_charge_mah) += 500.0f * (5.0f / 3600.0f);  // I_set*dt
            if (id(charger)->charge_status() == 3) {
              id(charger)->set_charge_enable(false);   // stop for a clean full OCV
              id(g_prof_state) = 4; id(g_state_ms) = now;
              ESP_LOGW("prof", "CHARGE done %.1f mAh -> REST_C", id(g_charge_mah));
            }
          } else if (st == 4) {                        // REST_C: settle -> OCV_full (100% anchor) -> next/done
            if (now - id(g_state_ms) >= (uint32_t) id(g_rest_s) * 1000) {
              id(g_ocv_c) = id(batt_v).state;
              id(g_cycle) += 1;
              ESP_LOGW("prof", "REST_C done OCV_full=%.3f cycle %d/%d", id(g_ocv_c), id(g_cycle), id(g_num_cycles));
              if (id(g_cycle) < id(g_num_cycles)) {
                id(charger)->set_charge_enable(false); id(charger)->set_hiz(true);   // next cycle: discharge
                id(g_prof_state) = 1; id(g_state_ms) = now;
              } else {
                id(charger)->set_hiz(false); id(charger)->set_charge_enable(true);   // done -> safe
                id(g_prof_state) = 0;
                ESP_LOGW("prof", "CYCLE RUN COMPLETE (%.1f mAh)", id(g_charge_mah));
              }
            }
          }
          char p[224];
          snprintf(p, sizeof(p),
            "{\"st\":%d,\"v\":%.3f,\"hiz\":%s,\"chg\":%d,\"pg\":%s,\"mah\":%.1f,\"cyc\":%d,"
            "\"ocv_d\":%.3f,\"ocv_c\":%.3f,\"floor\":%.3f}",
            id(g_prof_state), id(batt_v).state, id(charger)->hiz() ? "true" : "false",
            (int) id(charger)->charge_status(), id(charger)->power_good() ? "true" : "false",
            id(g_charge_mah), id(g_cycle), id(g_ocv_d), id(g_ocv_c), id(g_v_floor));
          id(mqtt_client)->publish("e1001-bench/battprofile", std::string(p), 0, false);

deep_sleep:                          # P4e Step 2: timer + button wake. Prevented at boot (pri 900); entered
  id: ds                             # explicitly at the end of the wake cycle, only when g_sleep_enable.
  sleep_duration: 15min              # static fallback; the runtime g_sleep_dur_s overrides this at each enter()
  esp32_ext1_wakeup:                 # Step 2b: press ANY user button to wake. Schematic sheet 6/9 confirms
    mode: ANY_LOW                    # external 10K pull-ups (R30/R34/R36) to SYS_3V3 on KEY0/1/2 -> pins held HIGH
    pins:                            # through deep sleep (SYS_3V3 stays up) -> ANY_LOW is spurious-wake-safe with
      - number: GPIO3                # NO RTC pull-up needed. A held button at wake still trips the OTA escape hatch;
        allow_other_uses: true       # a quick tap just wakes -> fetch -> render -> re-sleep after awake_grace.
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true

http_request:                        # P4c: fetch the server-authored spec (BFF) — plain GET, open on LAN
  useragent: esphome/e1001
  timeout: 8s
  verify_ssl: false

globals:                             # parsed tiles as parallel string vectors (std types → no custom-type include)
  - id: g_tile_labels
    type: std::vector<std::string>
    restore_value: false
  - id: g_tile_lines
    type: std::vector<std::string>
    restore_value: false
  - id: g_page                       # current page (buttons paginate; e-ink = discrete pages, not scroll)
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_alerts                     # active alerts (formatted strings) from /api/v1/alerts
    type: std::vector<std::string>
    restore_value: false
  - id: g_alert_crit                 # any critical alert present -> inverted banner
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_scene                      # active house scene (Home/Away/Sleep) from /api/v1/house, for the header
    type: std::string
    restore_value: false
  - id: g_fetch_uptime               # uptime_s (s) at last successful fetch -> footer "updated Xs ago"
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_edge_wall                  # edge-node: last-published on_wall (-1 unknown / 0 batt / 1 wall) for edge-only pub
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_pub_wall                   # edge-node: the on_wall value the publish script should emit (set by caller)
    type: bool
    restore_value: false
    initial_value: 'false'
  # --- battery_profiler (Module 2) state ---
  - id: g_prof_state                 # 0 IDLE / 1 DISCHARGE / 2 REST_D / 3 CHARGE / 4 REST_C. NEVER restore
    type: int                        # (a reboot must land IDLE = safe, not mid-discharge).
    restore_value: false
    initial_value: '0'
  - id: g_v_floor                    # discharge end / HIZ-clear threshold (V). Above brown-out (D1001=3.45V).
    type: float
    restore_value: false
    initial_value: '3.45'
  - id: g_state_ms                   # millis() at state entry (for rest timing)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_rest_s                     # rest duration (s) at REST_D/REST_C for OCV settle
    type: int
    restore_value: false
    initial_value: '120'
  - id: g_cycle                      # completed cycles this run
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_num_cycles                 # cycles to run
    type: int
    restore_value: false
    initial_value: '1'
  - id: g_load_lvl                   # extra discharge LOAD 0..3 (0=off). Runtime-dialable (Prof Load Level number);
    type: int                        # active only during DISCHARGE (g_prof_state==1). Speeds a slow low-power run.
    restore_value: false             # Capacity is from the charge-leg coulomb count (load-independent) so it stays
    initial_value: '0'               # correct; the loaded V-curve just reads at higher current. Burners in on_boot.
  - id: g_charge_mah                 # coulomb accumulator (charge leg: I_set 500mA * dt, CC-accurate)
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_ocv_d                      # rested OCV at the discharge floor
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_ocv_c                      # rested OCV at full (the 100% anchor)
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_stay_awake                 # P4e Step 1: set true when a button is HELD at boot -> gate deep-sleep.
    type: bool                       # The OTA escape hatch on a deep-sleep device. Step 1 only DETECTS + reports
    restore_value: false             # this (no sleep yet); Step 2's deep_sleep will consult it before sleeping.
    initial_value: 'false'
  - id: g_sleep_enable               # P4e battery-mode flag. RUNTIME (Sleep Enable switch) + PERSISTED across the
    type: bool                       # deep-sleep reboots (restore_value). DEV first-boot=false -> always awake.
    restore_value: true
    initial_value: '${sleep_default}'
  - id: g_sleep_dur_s                # timer sleep duration (s); RUNTIME (Sleep Duration number), persisted.
    type: int
    restore_value: true
    initial_value: '${sleep_dur_default_s}'
  - id: g_awake_grace_s              # awake window (s) per wake; RUNTIME (Awake Grace number), persisted.
    type: int
    restore_value: true
    initial_value: '${grace_default_s}'
  # --- ADR-0024 battery profile: versioned, runtime-loadable DATA (push over MQTT, no reflash). Same schema
  # + cmd/profile protocol as the D1001 (ha_battery_profile_rt). All restore_value: true -> a pushed profile
  # PERSISTS across reboots via ESPHome preferences (RestoringGlobals: int[]/int/bool memcpy-persist, std::string
  # via RestoringGlobalStringComponent). Baked ${...} defaults are used only on first boot / after "default". ---
  - id: g_soc_lut                    # V->SoC LUT: 21 pts base-frame mV, ascending; index i -> SoC 5*i %
    type: int[21]
    restore_value: true
    initial_value: '{${batt_soc_lut}}'
  - id: g_off_display_off_mv         # state offsets (mV above base frame); normalize removes them before the LUT
    type: int
    restore_value: true
    initial_value: '${prof_off_display_off}'
  - id: g_off_usb_mv
    type: int
    restore_value: true
    initial_value: '${prof_off_usb}'
  - id: g_off_charging_mv
    type: int
    restore_value: true
    initial_value: '${prof_off_charging}'
  - id: g_run_floor_mv               # safety floors (base-frame mV) — stored for the E3 power policy (ADR-0024 §3/4/6)
    type: int
    restore_value: true
    initial_value: '${prof_run_floor}'
  - id: g_warn_mv
    type: int
    restore_value: true
    initial_value: '${prof_warn}'
  - id: g_warn_clear_mv
    type: int
    restore_value: true
    initial_value: '${prof_warn_clear}'
  - id: g_boot_gate_mv
    type: int
    restore_value: true
    initial_value: '${prof_boot_gate}'
  - id: g_boot_release_mv
    type: int
    restore_value: true
    initial_value: '${prof_boot_release}'
  - id: g_prof_version               # provenance (ADR-0024: every profile is auditable) — persisted strings
    type: std::string
    restore_value: true
    initial_value: '"v1"'
  - id: g_prof_date
    type: std::string
    restore_value: true
    initial_value: '"${prof_date}"'
  - id: g_prof_method
    type: std::string
    restore_value: true
    initial_value: '"baked"'
  - id: g_prof_pushed                # false = baked default is live, true = a runtime-pushed profile is live
    type: bool
    restore_value: true
    initial_value: 'false'
  # --- ADR-0024 safety-policy runtime state (LUT-free: acts on the profile's mV floors, valid before any curve) ---
  - id: g_pp_low_streak              # consecutive sub-run-floor samples (debounce before deep-sleep-at-floor)
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_pp_warned                  # in the warn band -> renderer shows a LOW BATTERY banner
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pp_dark                    # boot-gate held the ePaper dark (cell below cold-start floor at boot)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pp_charge_me               # at the run floor -> renderer paints the full-screen CHARGE ME frame
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pp_do_warn                 # monitor->action intent flags (lambda decides; if-blocks actuate the components)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pp_do_redraw
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pp_do_shutdown
    type: bool
    restore_value: false
    initial_value: 'false'

# --- ePaper display (UC8179, 7.5" mono 800x480) — P4b: prove the display path ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_title
    size: 30
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_val
    size: 40
  - file: "fonts/DejaVuSans.ttf"
    id: font_label
    size: 20

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2                  # UC8179, 800x480 (confirmed: panel HT075A04)
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true                 # BUSY# is active-low on the schematic
    rotation: 270                    # portrait, USB port toward floor; lambda uses get_width/height so it reflows
    update_interval: never           # ePaper: draw on-demand (deep-sleep model), not on a timer.
    lambda: |-                       # P4c.1: paginated house sensor tiles (buttons navigate; e-ink = discrete pages).
      int w = it.get_width(), h = it.get_height();
      if (id(g_pp_charge_me)) {                    // ADR-0024 §3 deep-sleep-at-floor: full-screen low-battery notice
        it.rectangle(0, 0, w, h);
        it.print(w / 2, h / 2 - 34, id(font_val), TextAlign::CENTER, "LOW BATTERY");
        it.print(w / 2, h / 2 + 24, id(font_title), TextAlign::CENTER, "CHARGE ME");
        return;
      }
      it.rectangle(0, 0, w, h);
      // ADR-0024 §4 warn: a critical LOW BATTERY banner takes the top slot while in the warn band (device-local,
      // independent of the server /api/v1/alerts feed so a fetch can't clear it).
      bool warn = id(g_pp_warned);
      int bh = 0;                                 // banner height (0 = none)
      if (warn || !id(g_alerts).empty()) {
        bh = 48;
        std::string bt = warn ? std::string("LOW BATTERY - charge me") : id(g_alerts)[0];
        if (!warn && id(g_alerts).size() > 1) bt += "  (+" + std::to_string(id(g_alerts).size() - 1) + ")";
        if (warn || id(g_alert_crit)) {
          it.filled_rectangle(0, 0, w, bh);       // critical: inverted strip
          it.print(w / 2, bh / 2, id(font_label), COLOR_OFF, TextAlign::CENTER, bt.c_str());
        } else {
          it.rectangle(0, 0, w, bh);              // warning/info: outlined
          it.print(w / 2, bh / 2, id(font_label), TextAlign::CENTER, bt.c_str());
        }
      }
      // --- scene header: active house scene (left) + wall clock (right, only if SNTP-synced) ---
      int sh = 44, hy = bh;
      std::string scene = id(g_scene).empty() ? "House" : id(g_scene);
      it.print(16, hy + 6, id(font_title), scene.c_str());
      if (id(sntp_time).now().is_valid())
        it.strftime(w - 16, hy + 6, id(font_title), TextAlign::TOP_RIGHT, "%H:%M", id(sntp_time).now());
      it.line(0, hy + sh, w, hy + sh);
      // --- sensor grid (paginated; e-ink = discrete pages, buttons navigate) ---
      const int per = 6;                          // tiles per page
      int n = (int) id(g_tile_labels).size();
      int maxp = n == 0 ? 0 : (n - 1) / per;
      int page = id(g_page);
      if (page > maxp) { page = maxp; id(g_page) = maxp; }
      int gtop = hy + sh, ftop = h - 30;          // grid band [gtop, ftop); footer below ftop
      it.printf(w - 16, gtop + 4, id(font_label), TextAlign::TOP_RIGHT, "%d/%d", page + 1, maxp + 1);
      if (n == 0) {
        it.print(w / 2, (gtop + ftop) / 2, id(font_label), TextAlign::CENTER, "press Green to fetch");
      } else {
        int top = gtop + 30, bot = ftop - 4, rowh = (bot - top) / per, y = top;
        for (int i = page * per; i < n && i < (page + 1) * per; i++) {
          it.print(16, y + 4, id(font_label), id(g_tile_labels)[i].c_str());
          it.print(16, y + 26, id(font_val), id(g_tile_lines)[i].c_str());
          it.line(0, y + rowh, w, y + rowh);
          y += rowh;
        }
      }
      // --- status footer: last-update (relative) + wifi RSSI + battery % (ADR-0024 profile: normalize to the
      // base frame by the charge/USB state offset, then interpolate the loadable V->SoC LUT in g_soc_lut) ---
      it.line(0, ftop, w, ftop);
      float bv = id(batt_v).state;
      int bpct;
      {
        int mv = (int) (bv * 1000.0f + 0.5f);
        int cs = (int) id(charger)->charge_status();            // 1 pre / 2 fast = charging (elevates V)
        if (cs == 1 || cs == 2)         mv -= id(g_off_charging_mv);
        else if (id(charger)->power_good()) mv -= id(g_off_usb_mv);  // on-wall, not charging (USB I·R offset)
        auto &lut = id(g_soc_lut);
        if (std::isnan(bv) || mv <= lut[0]) bpct = 0;
        else if (mv >= lut[20]) bpct = 100;
        else { int i = 0; while (i < 20 && mv > lut[i + 1]) i++;
               bpct = 5 * i + (int) (5.0f * (mv - lut[i]) / (lut[i + 1] - lut[i]) + 0.5f); }
      }
      char ft[56];
      if (id(g_fetch_uptime) > 0)     // g_fetch_uptime is a float global (snapshot of uptime_s), not a sensor
        snprintf(ft, sizeof(ft), "updated %ds ago    wifi %.0f    %d%%",
                 (int)(id(uptime_s).state - id(g_fetch_uptime)), id(wifi_rssi).state, bpct);
      else
        snprintf(ft, sizeof(ft), "no data yet    wifi %.0f    %d%%", id(wifi_rssi).state, bpct);
      it.print(w / 2, h - 4, id(font_label), TextAlign::BOTTOM_CENTER, ft);

# --- Onboard temp/humidity (the [sensor] role, proven on first flash) ---
i2c:
  - id: bus_i2c0
    sda: GPIO19
    scl: GPIO20
    frequency: 100kHz
  - id: bus_i2c1                     # charger SY6974B + OPTIONAL touch controller live here.
    sda: GPIO39                      # boot scan logs every responder → settles "is touch populated?" (GT911/FT5x06/
    scl: GPIO40                      # CST816-class addr present = yes) and shows the charger, for free.
    frequency: 100kHz
    scan: true

# --- SY6974B charger (module: components/sy6974b) — status readout + control API for battery profiling ---
sy6974b:
  id: charger
  i2c_id: bus_i2c1
  address: 0x6B
  update_interval: 30s
  disable_watchdog: false            # watchdog stays at 40s HW default; the profiler kicks it during a run so a
                                     # profiler crash auto-recovers (WD expiry -> EN_HIZ=0 -> input reconnects)
  charge_status:
    name: "Charge Status"            # not_charging / pre_charge / fast_charge / done (REG08 CHRG_STAT)
  bus_status:
    name: "Input Source"             # no_input / usb_sdp / usb_cdp / usb_dcp / ... (REG08 BUS_STAT)
  power_good:
    name: "Power Good"               # REG08 PG_STAT — valid input present = ON WALL POWER
    # EDGE-NODE presence (Stage 1). Edge-only publish (change, not level — mirrors the D1001 power_ctx), and it
    # fires on the boot state-publish too (g_edge_wall starts -1) so the coordinator gets our state on join.
    on_state:
      - lambda: |-
          int n = x ? 1 : 0;
          if (n == id(g_edge_wall)) return;   // publish only on a real wall<->battery transition
          id(g_edge_wall) = n;
          id(g_pub_wall) = (n == 1);
          id(sb_relay)->set_enabled(n == 1);  // Stage 2: only relay BLE on wall power (pause on battery)
          id(publish_edge_event)->execute();
  charging:
    name: "Charging"                 # derived: fast/pre-charge phase

# --- Edge-node Stage 2: BLE coverage (SwitchBot meter relay), wall-power-gated (components/switchbot_ble) ---
esp32_ble_tracker:
  scan_parameters:
    active: false                    # passive: SwitchBot meters advertise; lighter + coexists with WiFi
    interval: 320ms
    window: 30ms                     # ~9% duty so BLE doesn't starve the shared 2.4GHz radio (edge gotcha)

switchbot_ble:
  id: sb_relay
  node: ${edge_node}                 # decodes SwitchBot adverts -> home/edge/${edge_node}/<mac>/adv

sensor:
  - platform: sht4x
    i2c_id: bus_i2c0
    address: 0x44
    temperature:
      name: "Temperature"
      id: sht_temp
      # SENSOR role: relay the E1001's own room reading on the edge onboard-sensor path (mirrors edge/ ha_gas.c
      # ha_mqtt_publish_node_sensor: home/edge/<node>/<key>/adv, transport i2c-local, mac=<reg_key>). The
      # already-running edge_mapper looks up mac in instance/devices.yaml and republishes canonical
      # home/<area>/e1001/state — no new server service. NOT power-gated (unlike the BLE relay): the device's
      # own reading is its primary [sensor] role, publish whenever awake. Needs a 1-line registry entry (gated).
      on_value:
        - lambda: |-
            float t = x, h = id(sht_hum).state;
            if (std::isnan(t) || std::isnan(h)) return;
            char p[256];
            snprintf(p, sizeof(p),
              "{\"schema\":1,\"node\":\"${edge_node}\",\"mac\":\"${edge_node}-sht40\",\"device_type\":\"sht40\","
              "\"ts\":\"\",\"transport\":\"i2c-local\",\"metrics\":{\"temperature_c\":%.2f,\"humidity_pct\":%.1f},"
              "\"meta\":{}}", t, h);
            // std::string(p): the char* publish() overload treats arg3 as payload_length (would send 1 byte)
            id(mqtt_client)->publish("home/edge/${edge_node}/sht40/adv", std::string(p), 1, false);
    humidity:
      name: "Humidity"
      id: sht_hum
    update_interval: 60s

  # Battery cell voltage. Divider is x2 (ADC reads Vbat/2); enable held on above.
  # This is raw voltage only — SoC/normalization/policy is the ha_battery reuse discussion, deferred on purpose.
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: batt_v
    attenuation: 12db
    update_interval: 10s             # 10s: feeds the ADR-0024 safety monitor (was 60s)
    filters:
      - multiply: 2.0                # divider x2 -> cell V
      - median:                      # ADR-0024 §1: symmetric filter, robust to a load-step spike (NOT one-way/latching)
          window_size: 5
          send_every: 1
          send_first_at: 1

  # diagnostics
  - platform: uptime
    name: "Uptime"
    id: uptime_s
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"

output:
  - platform: gpio
    pin: GPIO21
    id: vbat_adc_en
  - platform: gpio                     # external discharge-load gate (N-ch MOSFET on the J2 header, GPIO17/TX1).
    pin: GPIO17                        # Drives a ~4.7Ω/10W resistor across V_BAT to burn the cell down in ~hours,
    id: ext_load                       # not days (an ePaper S3 can't self-sink enough). HW gate pulldown keeps it
    # starts LOW (default) — off until the discharge logic drives it; a reset can't strand the load on the cell.

# --- Connectivity indicator + input sanity (nice-to-have, still beachhead-cheap) ---
light:
  - platform: status_led            # slow blink = wifi/api down, off = healthy. Flip `inverted:` if reversed.
    name: "Status LED"
    pin:
      number: GPIO6
      inverted: false

binary_sensor:
  # P4e Step 1: reports whether a button was HELD at boot (=> stay-awake/OTA mode). Observable over MQTT at
  # e1001-bench/binary_sensor/ota_hold_mode/state — this is how we prove the escape hatch BEFORE enabling sleep.
  - platform: template
    name: "OTA Hold Mode"
    id: ota_hold

  # Short vs long press (on_click duration ranges) → 3 buttons give 6 actions. Retune freely.
  - platform: gpio
    name: "Button Green"
    id: btn_green
    pin: { number: GPIO3, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Green short = re-fetch the spec + redraw
        max_length: 450ms
        then:
          - button.press: fetch_spec
      - min_length: 600ms            # Green long = home (page 0)
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = 0;'
          - component.update: epaper
  - platform: gpio
    name: "Button Right"
    id: btn_right
    pin: { number: GPIO4, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Right short = next page
        max_length: 450ms
        then:
          - lambda: |-
              int per = 6;
              int maxp = id(g_tile_labels).empty() ? 0 : ((int) id(g_tile_labels).size() - 1) / per;
              if (id(g_page) < maxp) id(g_page) += 1;
          - component.update: epaper
      - min_length: 600ms            # Right long = last page
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = id(g_tile_labels).empty() ? 0 : ((int) id(g_tile_labels).size() - 1) / 6;'
          - component.update: epaper
  - platform: gpio
    name: "Button Left"
    id: btn_left
    pin: { number: GPIO5, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Left short = previous page
        max_length: 450ms
        then:
          - lambda: 'if (id(g_page) > 0) id(g_page) -= 1;'
          - component.update: epaper
      - min_length: 600ms            # Left long = first page
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = 0;'
          - component.update: epaper

# ── Runtime deep-sleep controls (toggle/tune battery mode over MQTT — NO reflash) ──────
# g_sleep_enable / g_sleep_dur_s / g_awake_grace_s are the persisted source of truth; these just view+set them.
switch:
  - platform: template
    name: "Sleep Enable"             # e1001-bench/switch/sleep_enable/command  ON|OFF
    id: sw_sleep_enable              # ON = battery mode (sleeps between wakes); OFF = always awake (dev/OTA)
    lambda: 'return id(g_sleep_enable);'
    restore_mode: DISABLED           # the global is persisted (restore_value), so the switch must not fight it
    turn_on_action:
      - lambda: 'id(g_sleep_enable) = true;  ESP_LOGW("sleep", "battery mode ON (runtime)");'
    turn_off_action:
      - lambda: 'id(g_sleep_enable) = false; ESP_LOGW("sleep", "battery mode OFF (runtime, always-awake)");'

  # SY6974B charger control (bench profiling). SAFETY: the safety state machine is module 2; these are raw.
  - platform: template
    name: "Charger HIZ"              # ON = disconnect USB input -> system runs on battery (the DISCHARGE lever)
    id: sw_hiz
    lambda: 'return id(charger)->hiz();'
    restore_mode: DISABLED           # never auto-assert HIZ on boot; the charger's own state is the truth
    turn_on_action:
      - lambda: 'id(charger)->set_hiz(true);'
    turn_off_action:
      - lambda: 'id(charger)->set_hiz(false);'
  - platform: template
    name: "Charge Enable"           # OFF = stop charging (REG01 CHG_CONFIG=0) while leaving USB connected
    id: sw_charge_en
    lambda: 'return id(charger)->charge_enabled();'
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(charger)->set_charge_enable(true);'
    turn_off_action:
      - lambda: 'id(charger)->set_charge_enable(false);'

number:
  - platform: template
    name: "Sleep Duration"           # e1001-bench/number/sleep_duration/command  (seconds); applies next sleep
    id: num_sleep_dur
    unit_of_measurement: s
    min_value: 20
    max_value: 3600
    step: 5
    lambda: 'return id(g_sleep_dur_s);'
    set_action:
      - lambda: 'id(g_sleep_dur_s) = (int) x;'
  - platform: template
    name: "Awake Grace"              # e1001-bench/number/awake_grace/command  (seconds); awake window per wake
    id: num_awake_grace
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 5
    lambda: 'return id(g_awake_grace_s);'
    set_action:
      - lambda: 'id(g_awake_grace_s) = (int) x;'
  - platform: template
    name: "Prof V Floor"             # battery_profiler HIZ-clear threshold (V). Set ABOVE current V to trip the
    id: num_v_floor                  # safety gate instantly for validation; normal run = ~3.45 (above brown-out).
    unit_of_measurement: V
    min_value: 3.2
    max_value: 4.3
    step: 0.01
    lambda: 'return id(g_v_floor);'
    set_action:
      - lambda: 'id(g_v_floor) = x;'
  - platform: template
    name: "Prof Rest Seconds"        # OCV-settle duration at REST_D/REST_C (short for validation, ~120s real)
    id: num_rest_s
    unit_of_measurement: s
    min_value: 10
    max_value: 600
    step: 5
    lambda: 'return id(g_rest_s);'
    set_action:
      - lambda: 'id(g_rest_s) = (int) x;'
  - platform: template
    name: "Prof Num Cycles"          # how many discharge->charge cycles per run
    id: num_cycles
    min_value: 1
    max_value: 10
    step: 1
    lambda: 'return id(g_num_cycles);'
    set_action:
      - lambda: 'id(g_num_cycles) = (int) x;'
  - platform: template
    name: "Prof Load Level"          # extra load during DISCHARGE to speed a slow low-power run: 0=off .. 3=max.
    id: num_load_lvl                 # 1-2 = CPU burn (both cores); >=2 also streams WiFi TX. Dial live over MQTT, no
    min_value: 0                     # reflash. Higher load sags loaded V (curve reads at a higher current); capacity
    max_value: 3                     # is from the charge-leg coulomb count so it's unaffected. avg I = capacity/discharge_h.
    step: 1
    lambda: 'return id(g_load_lvl);'
    set_action:
      - lambda: 'id(g_load_lvl) = (int) x;'

# ── In-flight diagnostics (query over MQTT/API — no reflash, no serial) ────────────────
# The lesson from bring-up: don't reflash to inspect state, and don't chase boot-time serial logs.
# Everything here is readable/triggerable over the network at runtime.
debug:
  update_interval: 30s

button:
  # ADR-0024 safety-policy validation on USB (the monitor is inert on wall power): exercise the render actions.
  - platform: template
    name: "Test PP Warn"             # toggle the LOW BATTERY warn banner (e1001-bench/button/test_pp_warn/command)
    on_press:
      - lambda: 'id(g_pp_warned) = !id(g_pp_warned); id(g_pp_charge_me) = false;'
      - component.update: epaper
  - platform: template
    name: "Test PP ChargeMe"         # toggle the full-screen CHARGE ME floor frame (no sleep, for eyeballing)
    on_press:
      - lambda: 'id(g_pp_charge_me) = !id(g_pp_charge_me); id(g_pp_warned) = false;'
      - component.update: epaper
  - platform: restart
    name: "Restart"                  # reboot over MQTT (e1001-bench/button/restart/command <- "PRESS")
  - platform: template
    name: "Scan I2C"                 # on-demand bus scan → publishes found addrs to the I2C Devices text_sensor
    on_press:
      - lambda: |-
          std::string out;
          char buf[16];
          i2c::I2CBus *buses[2] = {id(bus_i2c0), id(bus_i2c1)};
          for (uint8_t bi = 0; bi < 2; bi++) {
            for (uint8_t a = 8; a < 120; a++) {
              if (buses[bi]->write(a, nullptr, 0) == i2c::ERROR_OK) {
                snprintf(buf, sizeof(buf), "i2c%d:0x%02X ", bi, a);
                out += buf;
              }
            }
          }
          if (out.empty()) out = "none";
          ESP_LOGI("i2cscan", "found: %s", out.c_str());
          id(i2c_found).publish_state(out);
  - platform: template
    name: "Refresh Display"          # redraw the ePaper on demand (e1001-bench/button/refresh_display/command)
    on_press:
      - component.update: epaper
  - platform: template
    name: "Fetch Spec"               # P4c: pull the BFF spec, parse into tiles, redraw (also bound to the Green button)
    id: fetch_spec
    on_press:
      - http_request.get:
          url: ${bff_base_url}/api/v1/sensors
          capture_response: true
          max_response_buffer_size: 24kB   # /api/v1/sensors ~10KB (16 sensors); default truncates it
          on_response:
            - lambda: |-
                ESP_LOGI("spec", "GET -> HTTP %d, %d bytes, %d ms",
                         response->status_code, body.length(), response->duration_ms);
                if (response->status_code != 200) return;
                id(g_tile_labels).clear();
                id(g_tile_lines).clear();
                bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                  for (JsonObject s : root["sensors"].as<JsonArray>()) {
                    if (id(g_tile_labels).size() >= 40) break;   // safety cap; buttons paginate the full set
                    const char *room = !s["room"].isNull() ? s["room"].as<const char *>()
                                                           : s["device_id"].as<const char *>();
                    JsonObject m = s["metrics"].as<JsonObject>();
                    std::string line;
                    int shown = 0;
                    for (JsonObject g : s["graphs"].as<JsonArray>()) {   // spec-driven: value + server precision + unit
                      if (shown >= 2) break;
                      const char *key = g["key"];
                      if (!key || m[key].isNull()) continue;
                      int prec = g["precision"] | 0;
                      const char *u = g["unit"] | "";
                      std::string unit;                                  // ASCII-strip for the mono font: "°C"->"C"
                      for (const char *p = u; *p; p++) if ((unsigned char) *p < 0x80) unit += *p;
                      float v = m[key].as<float>();
                      if (unit == "C") { v = v * 9.0f / 5.0f + 32.0f; unit = "F"; }   // C -> F
                      char fmt[8], val[16];
                      snprintf(fmt, sizeof(fmt), "%%.%df", prec);
                      snprintf(val, sizeof(val), fmt, v);
                      if (shown) line += "   ";
                      line += val;
                      if (!unit.empty()) { line += " "; line += unit; }
                      shown++;
                    }
                    if (line.empty()) line = "--";
                    id(g_tile_labels).push_back(room ? room : "?");
                    id(g_tile_lines).push_back(line);
                  }
                  return true;
                });
                ESP_LOGI("spec", "parsed %d tiles (ok=%d)", id(g_tile_labels).size(), ok);
                id(g_fetch_uptime) = id(uptime_s).state;   // stamp: footer shows "updated Xs ago"
      - http_request.get:                          # sibling: active house scene for the header (Home/Away/Sleep)
          url: ${bff_base_url}/api/v1/house
          capture_response: true
          max_response_buffer_size: 2kB
          on_response:
            - lambda: |-
                if (response->status_code != 200) return;
                json::parse_json(body, [](JsonObject root) -> bool {
                  const char *sc = root["scene"] | "";
                  id(g_scene) = sc;
                  return true;
                });
                ESP_LOGI("spec", "scene=%s", id(g_scene).c_str());
      - http_request.get:                          # sibling (not nested): pull active alerts for the banner
          url: ${bff_base_url}/api/v1/alerts
          capture_response: true
          max_response_buffer_size: 8kB
          on_response:
            - lambda: |-
                id(g_alerts).clear();
                id(g_alert_crit) = false;
                json::parse_json(body, [](JsonObject root) -> bool {
                  for (JsonObject a : root["alerts"].as<JsonArray>()) {
                    if (id(g_alerts).size() >= 6) break;
                    const char *sev = a["severity"] | "";
                    const char *name = a["name"].isNull() ? (a["device_id"] | "?") : (a["name"] | "?");
                    const char *detail = a["detail"] | "";
                    if (std::string(sev) == "critical") id(g_alert_crit) = true;
                    std::string line = name;
                    if (detail[0]) { line += " - "; line += detail; }
                    id(g_alerts).push_back(line);
                  }
                  return true;
                });
                ESP_LOGI("spec", "parsed %d alerts (crit=%d)", id(g_alerts).size(), id(g_alert_crit));
            - component.update: epaper
  - platform: template
    name: "Test Sleep"               # P4e bisect: isolate the deep_sleep MECHANISM from the on_boot wake-cycle.
    on_press:                        # trigger over MQTT; device should drop offline then return after sleep_duration.
      - lambda: 'ESP_LOGW("sleep", "Test Sleep pressed -> allow+enter deep sleep now (%ds)", id(g_sleep_dur_s));'
      - deep_sleep.allow: ds
      - deep_sleep.enter:
          id: ds
          sleep_duration: !lambda 'return (uint32_t) id(g_sleep_dur_s) * 1000;'
  - platform: template
    name: "Test Alert"               # dev affordance: inject a fake critical alert to preview the banner
    on_press:
      - lambda: |-
          id(g_alerts).clear();
          id(g_alerts).push_back("TEST - low battery 8%");
          id(g_alert_crit) = true;
      - component.update: epaper
  # Edge-node test hooks: simulate a wall<->battery transition WITHOUT physically unplugging (HIZ won't fake it
  # — VBUS stays present in HIZ, so power_good stays ON, which is correct). Validates the envelope + the
  # coordinator's rebalance end-to-end. Does NOT touch g_edge_wall, so the next real transition still fires.
  - platform: template
    name: "Test Edge On-Battery"     # e1001-bench/button/test_edge_on_battery/command PRESS -> going-offline event
    on_press:
      - lambda: 'id(g_pub_wall) = false;'
      - script.execute: publish_edge_event
  - platform: template
    name: "Test Edge On-Wall"
    on_press:
      - lambda: 'id(g_pub_wall) = true;'
      - script.execute: publish_edge_event

  # battery_profiler (Module 2) safety-core controls + validation hooks
  - platform: template
    name: "Prof Start Cycle"         # full discharge->rest->charge->rest cycle(s) on the safe core
    on_press:
      - lambda: |-
          id(charger)->set_watchdog_seconds(40);   // ensure WD on so a crash auto-recovers
          id(charger)->kick_watchdog();
          id(g_cycle) = 0; id(g_charge_mah) = 0;
          id(charger)->set_charge_enable(false);
          id(charger)->set_hiz(true);              // enter DISCHARGE
          id(g_prof_state) = 1; id(g_state_ms) = millis();
          ESP_LOGW("prof", "cycle run started: %d cycle(s), floor %.3f, rest %ds",
                   id(g_num_cycles), id(g_v_floor), id(g_rest_s));
  - platform: template
    name: "Prof Stop"                # clean stop -> IDLE safe state
    on_press:
      - lambda: |-
          id(g_prof_state) = 0;
          id(charger)->set_hiz(false);
          id(charger)->set_charge_enable(true);
          ESP_LOGW("prof", "STOPPED -> safe (HIZ off, charge on)");
  - platform: template
    name: "Prof Sim Crash"           # VALIDATION: set HIZ but leave state IDLE (nothing kicks) -> the un-kicked
    on_press:                        # watchdog must expire in ~40s and auto-clear HIZ. Proves the recovery net.
      - lambda: |-
          id(charger)->set_watchdog_seconds(40);
          id(charger)->set_hiz(true);
          ESP_LOGW("prof", "SIM CRASH: HIZ on, state IDLE (no kick) -> WD should recover in ~40s");

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
    device:
      name: "Device Info"
  - platform: template
    name: "I2C Devices"
    id: i2c_found
    update_interval: never          # set only by the Scan I2C button
