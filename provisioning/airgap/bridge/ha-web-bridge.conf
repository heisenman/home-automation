# HA air-gap web bridge — nginx reverse proxy on .210's HOUSEHOLD NIC -> ha-2's API on the air-gap side.
# This is an APP-LEVEL gateway: nginx terminates the household TLS connection and originates a NEW
# connection to ha-2 over the .210 WiFi bridge (wlp2s0). It is NOT IP forwarding — the box's ip_forward
# stays 0, so the air gap holds; only the vetted HTTP app crosses. Household browsers use
# https://192.168.0.210/ . Auth is end-to-end (the bearer is passed through to ha-2's own authz).
# NOT VIP-gated: this ALWAYS runs on .210 (the permanent bridge), independent of any cluster role.
# See docs/airgap/MIGRATION-DESIGN-LOG.md (DJ-3, DJ-15).

upstream ha2_airgap {
    server 192.168.1.210:8123;      # ha-2's API, reached over the .210 WiFi bridge
    keepalive 8;
}

server {
    listen 192.168.0.210:443 ssl;   # HOUSEHOLD side ONLY — never 0.0.0.0 (must not be exposed on the air-gap net)
    server_name _;

    ssl_certificate     /home/visko/home_automation/instance/tls/server.crt;
    ssl_certificate_key /home/visko/home_automation/instance/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HARDENING TODO (provisioning/airgap/bridge/allowlist.md): make this a default-DENY allowlist —
    # permit only the PWA + /api/v1/* + the whitelisted control POSTs; the proxy is the one sanctioned hole.
    location / {
        proxy_pass http://ha2_airgap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;   # end-to-end auth: ha-2's api enforces
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
