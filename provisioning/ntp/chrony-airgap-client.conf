# Air-gap NTP client — for a box on the air-gap net (ha-2, future air-gap boxes) that has NO internet.
# Drop-in for /etc/chrony/conf.d/ (sourced via `confdir /etc/chrony/conf.d`).
#
# WHY: an air-gapped box cannot reach `pool.*.ntp.org`, so a stock chrony (which ships a `pool` line)
# gets ZERO reachable sources and free-runs — and drift >30s breaks device control (edge nodes enforce
# DEFAULT_MAX_AGE_S=30). Point it at the internet-disciplined air-gap NTP anchor instead: .210 on the
# air-gap net (192.168.1.245). See docs/adr/ADR-0033-airgap-internet-relay.md + AIRGAP-RELAY-DESIGN.md §4 (A1).
#
# INSTALL (on the air-gap box):
#   1. comment out the internet `pool ... ntp.org` line in /etc/chrony/chrony.conf (unreachable air-gapped)
#   2. install this file to /etc/chrony/conf.d/airgap-upstream.conf
#   3. sudo systemctl restart chrony  &&  chronyc tracking   (expect Reference ID = 192.168.1.245)

# The air-gap NTP anchor (.210, disciplined from the internet on its household leg).
server 192.168.1.245 iburst

# Keep serving edge nodes on the air-gap net even if .210 is briefly unreachable (island fallback).
local stratum 10
