# Levoit Vital 200S (LAP-V201S, ESP32-C3-SOLO-1) — FULL purifier control.
#
# PROGRAMMING HEADER on this unit's PCB (labels as silk-screened): EN | GND | VCC(3.3V) | TXD | RXD | IO0.
#   Flash over UART (NOT JTAG; NOT the SC95F keypad-MCU's separate 5V RX/TX pads). 3.3V logic ONLY.
#   Wiring: prog TX->RXD, prog RX->TXD, GND, and VCC=3.3V (power the board from the programmer with the unit
#     UNPLUGGED from mains — one power source only).
#   Download mode: hold IO0->GND, pulse EN->GND (reset), release EN, release IO0. `IO0` is the boot-strap pad
#     (maker's conventional label; drive the pad, don't worry that the C3's internal strap is GPIO9). Release
#     IO0 (HIGH) after flashing so it boots the app. esptool prints the chip on connect = the confirmation.
#   Status: believed-correct from the header labels; CONFIRM on first successful esptool connect, then delete
#     this caveat. (See memory levoit-programming-header.)
# = tuct/levoit's tested Vital 200S config (UART GPIO18/19 to the MCU, model VITAL200S, full entity set)
#   merged with our beachhead networking (name levoit-office, our WiFi/OTA secrets, MQTT -> .210 for our bus).
# Pushed via OTA over the beachhead. WiFi/OTA/fallback-AP unchanged, so recovery paths are intact.
substitutions:
  device_name: levoit-office
  wifi_ap_ssid: "levoit-office-fallback"
  rx_pin: GPIO18                 # C3-SOLO-1 -> Vital 200S MCU UART (tuct, tested) — NOT the flash pads
  tx_pin: GPIO19

esphome:
  name: ${device_name}
  friendly_name: Levoit Office

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/tuct/levoit
      ref: main
    components: [levoit]

logger:
  level: INFO                     # final flash — bump back to DEBUG only when diagnosing MCU comms

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid           # autohome_airgap (air-gap, primary)
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_2          # CTWap_24g (household — fallback so OTA still works if air-gap wifi drops)
      password: !secret wifi_password_2
  power_save_mode: none
  ap:
    ssid: "${wifi_ap_ssid}"
    password: !secret fallback_ap_password

captive_portal:

# Recovery margin: reboot-loop -> minimal OTA-able safe mode; + always-on local control/config UI.
safe_mode:

web_server:
  port: 80

mqtt:
  broker: 192.168.1.210          # ha-2 air-gap dictator (born air-gap; broker is anonymous-on-LAN, no creds)
  port: 1883

uart:
  - id: uart_mcu2esp
    tx_pin:
      number: ${tx_pin}
      inverted: false
    rx_pin:
      number: ${rx_pin}
      inverted: false
    baud_rate: 115200

levoit:
  id: levoitvital200
  model: VITAL200S

