# Dedicated minimal relay broker (ADR-0033 Q1) — a SEPARATE mosquitto instance, isolated from the dev
# broker (1883/household) and the failover broker (1883/air-gap). Carries only relay/# request/response.
# Reached by ha-2 on the air-gap net; the nftables default-deny (ADR-0033 §5, Phase 1c) is what restricts
# WHO can reach it — this config restricts WHAT they can do (ACL) and requires auth.
per_listener_settings true
listener 1884
allow_anonymous false
password_file /etc/mosquitto/relay.passwd
acl_file /etc/mosquitto/relay.acl
persistence false
max_inflight_messages 20
max_queued_messages 100
log_dest syslog
log_type warning
