# HA dictator = LAN NTP anchor.  Drop-in for /etc/chrony/conf.d/ (sourced by the Debian default
# /etc/chrony/chrony.conf via `confdir`).  Installed by provisioning/ntp/install-ntp-serve.sh.
# See provisioning/ntp/README.md.

# Answer NTP queries from the LAN (edge nodes; e.g. the E1001 SNTP client -> the dictator).
# .210 is dual-homed, so it anchors BOTH nets: household (0.0/24) AND the air-gap net (1.0/24) where
# ha-2 + the air-gap edge fleet live. Without the 1.0/24 allow, chrony refuses ha-2's queries (501) and
# the air-gapped box free-runs. (install-ntp-serve.sh regenerates these from its CIDR args.)
allow 192.168.0.0/24
allow 192.168.1.0/24

# Remain a usable time source even when the upstream pool is unreachable — i.e. once the network is
# air-gapped behind the OpenWRT router. `local stratum 10` makes the dictator's own clock a fallback
# reference so LAN clients keep trusting it; while the internet pool IS reachable (pre-air-gap) chrony
# still disciplines to it, so this only kicks in during the gap.
local stratum 10
