# Example actuator control registry. Copy to instance/control.yaml (gitignored) and edit.
# Actuators are described by TRAITS (ADR-0002), not products. The dictator (PEP) commands them via
# the owning edge node. Per-device secrets go in instance/control_secrets.yaml.
#
# LOCAL-DRIVER appliances (node: server) are resolved by `device_type` so the controller finds them by TYPE,
# not a hardcoded id — rename/relocate them freely and the wiring follows (ADR-0026):
#   device_type: dehumidifier   -> Midea LAN driver + default RH policy   (instance/midea-device.env)
#   device_type: air_purifier   -> Levoit driver + PM2.5 policy           (instance/levoit-devices.yaml)
#   device_type: panel          -> reTerminal wall-panel scene follower   (instance/panel-devices.yaml)
version: 1
devices:
  # a dimmable lamp = switchable + ranged, driven through edge node c6-bench
  lamp_office:
    node: c6-bench
    area: c_office
    traits:
      switchable: {}
      ranged: {min: 0, max: 100}

  # a smart lock = lockable; unlock is sensitive (needs confirm + nonce)
  lock_front:
    node: c6-bench
    area: entry
    traits:
      lockable: {}

  # a thermostat setpoint with bounds + a safe value for standing orders
  thermostat_main:
    node: c6-bench
    area: living_room
    traits:
      setpoint: {min: 10, max: 30, unit: degC, safe_value: 18}

  # Broan ERV via edge node hvac_c6 (ADR-0041) — signed RS-485 control, confirmed by the ERV's own readback
  # (server/control/erv_driver.py, routed by device_type erv). `manual: true` = shown in the PWA with its
  # controls but no automation policy. Mode values are the Broan wire codes, verified live 2026-10-04
  # (design §7.2 log); 0x02 (OVR) is deliberately absent. `timed` = the OVR relay boost, capped on-node.
  erv_attic:
    node: hvac_c6
    area: attic
    device_type: erv
    manual: true
    traits:
      mode:
        values: {"off": 1, "int": 8, "low": 9, "med": 11, "high": 10, "turbo": 12}   # quote "off": YAML 1.1 reads it as False
        labels: {int: Intermittent}
        safe: med
        label: Ventilation
      timed: {max: 60, presets_min: [15, 30, 60], label: Boost (max airflow)}
