# Seeed reTerminal E1001 — BEACHHEAD (connectivity + onboard sensors; NO display yet).
# Board: ESP32-S3R8 (8MB octal PSRAM), 32MB flash (W25Q256). Panel: 7.5" mono 800x480, UC8179 (added later).
# Path proven by the fleet: minimal WiFi + OTA + captive_portal + MQTT(.210), prove it joins, THEN add the
# ePaper renderer over OTA. First flash is SERIAL (esphome run over /dev/ttyUSB0) — it overwrites SenseCraft
# (backed up to ~/e1001-sensecraft-factory.bin first). Everything after is OTA-iterable.
#
# Pins are schematic-confirmed (reTerminal_E1001_V1_2_SCH) + cross-checked against shipping ESPHome configs:
#   SHT4x  I2C0  SDA=GPIO19 SCL=GPIO20 @0x44        Battery  sense=GPIO1  enable=GPIO21  divider x2.0
#   Buttons GPIO3(green)/4/5   LED GPIO6   Buzzer GPIO45      (ePaper SPI: clk7/mosi9 cs10 dc11 rst12 busy13)
#   MAC a4:cb:8f:cf:46:e8

substitutions:
  device_name: e1001-bench          # rename to e1001-<area> when it's mounted
  friendly_name: "reTerminal E1001 (bench)"
  wifi_ap_ssid: "e1001-bench-fallback"
  bff_base_url: "http://192.168.0.210:8123"   # FastAPI BFF; read endpoints are open on the LAN (no auth on GET)
  edge_node: "e1001"                 # edge-node id for home/edge/<node>/event (rename per-area on deploy)
  # P4e deep-sleep RUNTIME hooks — no reflash to toggle. These are first-boot DEFAULTS only; thereafter the
  # Sleep Enable switch + Sleep Duration / Awake Grace numbers are MQTT-settable and PERSIST across sleeps.
  sleep_default: "false"            # DEV first-boot: never sleep -> OTA always reachable. Flip live over MQTT.
  sleep_dur_default_s: "900"        # 15 min timer cadence (battery/freshness knob), runtime-tunable
  grace_default_s: "25"             # awake window per wake (wifi + fetch + ~5s render + read), runtime-tunable

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 900                  # EARLIEST: block auto deep-sleep so OTA is always reachable. We enter sleep
      then:                          # EXPLICITLY at the end of the wake cycle (priority -200) and only if enabled.
        - deep_sleep.prevent: ds
    - priority: 600                  # NOT 800: at 800 the gpio output isn't constructed yet → turn_on no-ops →
      then:                          # rail never powered → ADC reads 0. 600 = after components, per the ref config.
        - output.turn_on: vbat_adc_en  # power the battery-sense divider (held on in beachhead; gated later)
    - priority: -100                 # after everything is up: one-shot draw (update_interval is 'never', ePaper style)
      then:
        - component.update: epaper
    - priority: -200                 # LAST: P4e Step 1 — read the buttons AFTER the display draw and settle time.
      then:                          # Held button at boot => "stay awake for OTA" (the escape hatch for Step 2's sleep).
        - delay: 300ms               # let the gpio binary_sensors publish their initial state before we read them
        - if:
            condition:
              lambda: 'return id(btn_green).state || id(btn_right).state || id(btn_left).state;'
            then:
              - lambda: 'id(g_stay_awake) = true;'
              - lambda: 'ESP_LOGW("ota", "BUTTON HELD AT BOOT -> STAY-AWAKE (OTA mode). Deep-sleep will be gated.");'
              - binary_sensor.template.publish: { id: ota_hold, state: true }
            else:
              - lambda: 'ESP_LOGI("ota", "no button held at boot -> normal wake (Step 2: would deep-sleep).");'
              - binary_sensor.template.publish: { id: ota_hold, state: false }
        # P4e Step 2 — battery-mode wake cycle. Same automation as the button check above (sequential, no race):
        # only sleeps if enabled AND no button held. In DEV (sleep_enable=false) this whole branch is skipped.
        - if:
            condition:
              lambda: 'return id(g_sleep_enable) && !id(g_stay_awake);'
            then:
              - button.press: fetch_spec         # wake -> fetch fresh spec + alerts (fetch_spec redraws the ePaper)
              - delay: !lambda 'return (uint32_t) id(g_awake_grace_s) * 1000;'  # runtime awake window (s->ms)
              - lambda: 'ESP_LOGW("sleep", "wake cycle done -> deep-sleep for %ds", id(g_sleep_dur_s));'
              - deep_sleep.allow: ds             # clear the boot-time prevent, then enter timer sleep
              - deep_sleep.enter:
                  id: ds
                  sleep_duration: !lambda 'return (uint32_t) id(g_sleep_dur_s) * 1000;'  # runtime cadence (s->ms)

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB                    # chip is 32MB (W25Q256) but >16MB OTA needs esp-idf experimental flag;
                                     # E1001 is [status,sensor] not a data node, so 8MB (OTA + fonts) is ample.
  framework:
    type: esp-idf

logger:
  level: DEBUG                       # rides to MQTT ${device_name}/debug while we verify; drop to INFO later
  hardware_uart: UART0               # this board's console is UART0→CH340 (/dev/ttyUSB0); S3 default (USB-JTAG)
                                     # goes to GPIO19/20 which are repurposed as I2C0 here → silent. Force UART0.

api:                                 # native ESPHome API (wifi logs + optional HA integration)

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${wifi_ap_ssid}"
    password: !secret fallback_ap_password

captive_portal:

external_components:
  - source: components               # local: components/sy6974b (charger driver) + e1001_ui scaffold

mqtt:
  id: mqtt_client                    # referenced by the edge-node event publisher (home/edge/<node>/event)
  broker: 192.168.0.210              # dictator real IP (VIP .200 unreachable from CTWap_24g wifi)
  port: 1883

# Edge-node event publisher (Stage 1). Reusable script: emits the canonical home/edge/<node>/event envelope
# (schema 1, kind:power). Called on real power_good transitions AND from the Test Edge buttons. Mirrors the
# D1001's power_ctx_publish (beachhead_main.c:597); the coordinator's event-reconcile consumes home/edge/+/event
# and rebalances coverage on relaying->false (rollup-ladder-and-replica-sync.md:190).
script:
  - id: publish_edge_event           # emits the envelope for id(g_pub_wall); caller sets g_pub_wall then executes
    then:
      - lambda: |-
          bool w = id(g_pub_wall);
          std::string p = std::string(
            "{\"schema\":1,\"node\":\"${edge_node}\",\"kind\":\"power\",\"ts\":\"\",\"state\":{\"on_wall\":")
            + (w ? "true" : "false")
            + ",\"relaying\":" + (w ? "true" : "false")   // relaying gated on wall power (BLE = Stage 2)
            + ",\"censusing\":false}}";                    // E1001 is not a recovery/census node (ADR-0019)
          id(mqtt_client)->publish("home/edge/${edge_node}/event", p, 1, true);
          ESP_LOGW("edge", "published home/edge/${edge_node}/event on_wall=%s", w ? "true" : "false");

deep_sleep:                          # P4e Step 2: timer + button wake. Prevented at boot (pri 900); entered
  id: ds                             # explicitly at the end of the wake cycle, only when g_sleep_enable.
  sleep_duration: 15min              # static fallback; the runtime g_sleep_dur_s overrides this at each enter()
  esp32_ext1_wakeup:                 # Step 2b: press ANY user button to wake. Schematic sheet 6/9 confirms
    mode: ANY_LOW                    # external 10K pull-ups (R30/R34/R36) to SYS_3V3 on KEY0/1/2 -> pins held HIGH
    pins:                            # through deep sleep (SYS_3V3 stays up) -> ANY_LOW is spurious-wake-safe with
      - number: GPIO3                # NO RTC pull-up needed. A held button at wake still trips the OTA escape hatch;
        allow_other_uses: true       # a quick tap just wakes -> fetch -> render -> re-sleep after awake_grace.
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true

http_request:                        # P4c: fetch the server-authored spec (BFF) — plain GET, open on LAN
  useragent: esphome/e1001
  timeout: 8s
  verify_ssl: false

globals:                             # parsed tiles as parallel string vectors (std types → no custom-type include)
  - id: g_tile_labels
    type: std::vector<std::string>
    restore_value: false
  - id: g_tile_lines
    type: std::vector<std::string>
    restore_value: false
  - id: g_page                       # current page (buttons paginate; e-ink = discrete pages, not scroll)
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_alerts                     # active alerts (formatted strings) from /api/v1/alerts
    type: std::vector<std::string>
    restore_value: false
  - id: g_alert_crit                 # any critical alert present -> inverted banner
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_edge_wall                  # edge-node: last-published on_wall (-1 unknown / 0 batt / 1 wall) for edge-only pub
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_pub_wall                   # edge-node: the on_wall value the publish script should emit (set by caller)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_stay_awake                 # P4e Step 1: set true when a button is HELD at boot -> gate deep-sleep.
    type: bool                       # The OTA escape hatch on a deep-sleep device. Step 1 only DETECTS + reports
    restore_value: false             # this (no sleep yet); Step 2's deep_sleep will consult it before sleeping.
    initial_value: 'false'
  - id: g_sleep_enable               # P4e battery-mode flag. RUNTIME (Sleep Enable switch) + PERSISTED across the
    type: bool                       # deep-sleep reboots (restore_value). DEV first-boot=false -> always awake.
    restore_value: true
    initial_value: '${sleep_default}'
  - id: g_sleep_dur_s                # timer sleep duration (s); RUNTIME (Sleep Duration number), persisted.
    type: int
    restore_value: true
    initial_value: '${sleep_dur_default_s}'
  - id: g_awake_grace_s              # awake window (s) per wake; RUNTIME (Awake Grace number), persisted.
    type: int
    restore_value: true
    initial_value: '${grace_default_s}'

# --- ePaper display (UC8179, 7.5" mono 800x480) — P4b: prove the display path ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_title
    size: 30
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: font_val
    size: 40
  - file: "fonts/DejaVuSans.ttf"
    id: font_label
    size: 20

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2                  # UC8179, 800x480 (confirmed: panel HT075A04)
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true                 # BUSY# is active-low on the schematic
    rotation: 270                    # portrait, USB port toward floor; lambda uses get_width/height so it reflows
    update_interval: never           # ePaper: draw on-demand (deep-sleep model), not on a timer.
    lambda: |-                       # P4c.1: paginated house sensor tiles (buttons navigate; e-ink = discrete pages).
      int w = it.get_width(), h = it.get_height();
      it.rectangle(0, 0, w, h);
      int bh = 0;                                 // alert banner height (0 = no active alerts)
      if (!id(g_alerts).empty()) {
        bh = 48;
        std::string bt = id(g_alerts)[0];
        if (id(g_alerts).size() > 1) bt += "  (+" + std::to_string(id(g_alerts).size() - 1) + ")";
        if (id(g_alert_crit)) {
          it.filled_rectangle(0, 0, w, bh);       // critical: inverted strip
          it.print(w / 2, bh / 2, id(font_label), COLOR_OFF, TextAlign::CENTER, bt.c_str());
        } else {
          it.rectangle(0, 0, w, bh);              // warning/info: outlined
          it.print(w / 2, bh / 2, id(font_label), TextAlign::CENTER, bt.c_str());
        }
      }
      const int per = 6;                          // tiles per page
      int n = (int) id(g_tile_labels).size();
      int maxp = n == 0 ? 0 : (n - 1) / per;
      int page = id(g_page);
      if (page > maxp) { page = maxp; id(g_page) = maxp; }
      it.printf(w / 2, bh + 12, id(font_title), TextAlign::TOP_CENTER, "House  %d/%d", page + 1, maxp + 1);
      it.line(0, bh + 52, w, bh + 52);
      if (n == 0) {
        it.print(w / 2, h / 2, id(font_label), TextAlign::CENTER, "press Green to fetch");
      } else {
        int top = bh + 60, bot = h - 34, rowh = (bot - top) / per, y = top;
        for (int i = page * per; i < n && i < (page + 1) * per; i++) {
          it.print(16, y + 6, id(font_label), id(g_tile_labels)[i].c_str());
          it.print(16, y + 30, id(font_val), id(g_tile_lines)[i].c_str());
          it.line(0, y + rowh, w, y + rowh);
          y += rowh;
        }
      }
      it.printf(w / 2, h - 6, id(font_label), TextAlign::BOTTOM_CENTER,
                "%d sensors   up %.0fs", n, id(uptime_s).state);

# --- Onboard temp/humidity (the [sensor] role, proven on first flash) ---
i2c:
  - id: bus_i2c0
    sda: GPIO19
    scl: GPIO20
    frequency: 100kHz
  - id: bus_i2c1                     # charger SY6974B + OPTIONAL touch controller live here.
    sda: GPIO39                      # boot scan logs every responder → settles "is touch populated?" (GT911/FT5x06/
    scl: GPIO40                      # CST816-class addr present = yes) and shows the charger, for free.
    frequency: 100kHz
    scan: true

# --- SY6974B charger (module: components/sy6974b) — status readout + control API for battery profiling ---
sy6974b:
  id: charger
  i2c_id: bus_i2c1
  address: 0x6B
  update_interval: 30s
  disable_watchdog: true             # hold HIZ/charge states across a profiling run (see component setup note)
  charge_status:
    name: "Charge Status"            # not_charging / pre_charge / fast_charge / done (REG08 CHRG_STAT)
  bus_status:
    name: "Input Source"             # no_input / usb_sdp / usb_cdp / usb_dcp / ... (REG08 BUS_STAT)
  power_good:
    name: "Power Good"               # REG08 PG_STAT — valid input present = ON WALL POWER
    # EDGE-NODE presence (Stage 1). Edge-only publish (change, not level — mirrors the D1001 power_ctx), and it
    # fires on the boot state-publish too (g_edge_wall starts -1) so the coordinator gets our state on join.
    on_state:
      - lambda: |-
          int n = x ? 1 : 0;
          if (n == id(g_edge_wall)) return;   // publish only on a real wall<->battery transition
          id(g_edge_wall) = n;
          id(g_pub_wall) = (n == 1);
          id(sb_relay)->set_enabled(n == 1);  // Stage 2: only relay BLE on wall power (pause on battery)
          id(publish_edge_event)->execute();
  charging:
    name: "Charging"                 # derived: fast/pre-charge phase

# --- Edge-node Stage 2: BLE coverage (SwitchBot meter relay), wall-power-gated (components/switchbot_ble) ---
esp32_ble_tracker:
  scan_parameters:
    active: false                    # passive: SwitchBot meters advertise; lighter + coexists with WiFi
    interval: 320ms
    window: 30ms                     # ~9% duty so BLE doesn't starve the shared 2.4GHz radio (edge gotcha)

switchbot_ble:
  id: sb_relay
  node: ${edge_node}                 # decodes SwitchBot adverts -> home/edge/${edge_node}/<mac>/adv

sensor:
  - platform: sht4x
    i2c_id: bus_i2c0
    address: 0x44
    temperature:
      name: "Temperature"
      id: sht_temp
    humidity:
      name: "Humidity"
      id: sht_hum
    update_interval: 60s

  # Battery cell voltage. Divider is x2 (ADC reads Vbat/2); enable held on above.
  # This is raw voltage only — SoC/normalization/policy is the ha_battery reuse discussion, deferred on purpose.
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: batt_v
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

  # diagnostics
  - platform: uptime
    name: "Uptime"
    id: uptime_s
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"

output:
  - platform: gpio
    pin: GPIO21
    id: vbat_adc_en

# --- Connectivity indicator + input sanity (nice-to-have, still beachhead-cheap) ---
light:
  - platform: status_led            # slow blink = wifi/api down, off = healthy. Flip `inverted:` if reversed.
    name: "Status LED"
    pin:
      number: GPIO6
      inverted: false

binary_sensor:
  # P4e Step 1: reports whether a button was HELD at boot (=> stay-awake/OTA mode). Observable over MQTT at
  # e1001-bench/binary_sensor/ota_hold_mode/state — this is how we prove the escape hatch BEFORE enabling sleep.
  - platform: template
    name: "OTA Hold Mode"
    id: ota_hold

  # Short vs long press (on_click duration ranges) → 3 buttons give 6 actions. Retune freely.
  - platform: gpio
    name: "Button Green"
    id: btn_green
    pin: { number: GPIO3, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Green short = re-fetch the spec + redraw
        max_length: 450ms
        then:
          - button.press: fetch_spec
      - min_length: 600ms            # Green long = home (page 0)
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = 0;'
          - component.update: epaper
  - platform: gpio
    name: "Button Right"
    id: btn_right
    pin: { number: GPIO4, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Right short = next page
        max_length: 450ms
        then:
          - lambda: |-
              int per = 6;
              int maxp = id(g_tile_labels).empty() ? 0 : ((int) id(g_tile_labels).size() - 1) / per;
              if (id(g_page) < maxp) id(g_page) += 1;
          - component.update: epaper
      - min_length: 600ms            # Right long = last page
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = id(g_tile_labels).empty() ? 0 : ((int) id(g_tile_labels).size() - 1) / 6;'
          - component.update: epaper
  - platform: gpio
    name: "Button Left"
    id: btn_left
    pin: { number: GPIO5, mode: { input: true, pullup: true }, inverted: true, allow_other_uses: true }
    on_click:
      - min_length: 30ms             # Left short = previous page
        max_length: 450ms
        then:
          - lambda: 'if (id(g_page) > 0) id(g_page) -= 1;'
          - component.update: epaper
      - min_length: 600ms            # Left long = first page
        max_length: 5000ms
        then:
          - lambda: 'id(g_page) = 0;'
          - component.update: epaper

# ── Runtime deep-sleep controls (toggle/tune battery mode over MQTT — NO reflash) ──────
# g_sleep_enable / g_sleep_dur_s / g_awake_grace_s are the persisted source of truth; these just view+set them.
switch:
  - platform: template
    name: "Sleep Enable"             # e1001-bench/switch/sleep_enable/command  ON|OFF
    id: sw_sleep_enable              # ON = battery mode (sleeps between wakes); OFF = always awake (dev/OTA)
    lambda: 'return id(g_sleep_enable);'
    restore_mode: DISABLED           # the global is persisted (restore_value), so the switch must not fight it
    turn_on_action:
      - lambda: 'id(g_sleep_enable) = true;  ESP_LOGW("sleep", "battery mode ON (runtime)");'
    turn_off_action:
      - lambda: 'id(g_sleep_enable) = false; ESP_LOGW("sleep", "battery mode OFF (runtime, always-awake)");'

  # SY6974B charger control (bench profiling). SAFETY: the safety state machine is module 2; these are raw.
  - platform: template
    name: "Charger HIZ"              # ON = disconnect USB input -> system runs on battery (the DISCHARGE lever)
    id: sw_hiz
    lambda: 'return id(charger)->hiz();'
    restore_mode: DISABLED           # never auto-assert HIZ on boot; the charger's own state is the truth
    turn_on_action:
      - lambda: 'id(charger)->set_hiz(true);'
    turn_off_action:
      - lambda: 'id(charger)->set_hiz(false);'
  - platform: template
    name: "Charge Enable"           # OFF = stop charging (REG01 CHG_CONFIG=0) while leaving USB connected
    id: sw_charge_en
    lambda: 'return id(charger)->charge_enabled();'
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(charger)->set_charge_enable(true);'
    turn_off_action:
      - lambda: 'id(charger)->set_charge_enable(false);'

number:
  - platform: template
    name: "Sleep Duration"           # e1001-bench/number/sleep_duration/command  (seconds); applies next sleep
    id: num_sleep_dur
    unit_of_measurement: s
    min_value: 20
    max_value: 3600
    step: 5
    lambda: 'return id(g_sleep_dur_s);'
    set_action:
      - lambda: 'id(g_sleep_dur_s) = (int) x;'
  - platform: template
    name: "Awake Grace"              # e1001-bench/number/awake_grace/command  (seconds); awake window per wake
    id: num_awake_grace
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 5
    lambda: 'return id(g_awake_grace_s);'
    set_action:
      - lambda: 'id(g_awake_grace_s) = (int) x;'

# ── In-flight diagnostics (query over MQTT/API — no reflash, no serial) ────────────────
# The lesson from bring-up: don't reflash to inspect state, and don't chase boot-time serial logs.
# Everything here is readable/triggerable over the network at runtime.
debug:
  update_interval: 30s

button:
  - platform: restart
    name: "Restart"                  # reboot over MQTT (e1001-bench/button/restart/command <- "PRESS")
  - platform: template
    name: "Scan I2C"                 # on-demand bus scan → publishes found addrs to the I2C Devices text_sensor
    on_press:
      - lambda: |-
          std::string out;
          char buf[16];
          i2c::I2CBus *buses[2] = {id(bus_i2c0), id(bus_i2c1)};
          for (uint8_t bi = 0; bi < 2; bi++) {
            for (uint8_t a = 8; a < 120; a++) {
              if (buses[bi]->write(a, nullptr, 0) == i2c::ERROR_OK) {
                snprintf(buf, sizeof(buf), "i2c%d:0x%02X ", bi, a);
                out += buf;
              }
            }
          }
          if (out.empty()) out = "none";
          ESP_LOGI("i2cscan", "found: %s", out.c_str());
          id(i2c_found).publish_state(out);
  - platform: template
    name: "Refresh Display"          # redraw the ePaper on demand (e1001-bench/button/refresh_display/command)
    on_press:
      - component.update: epaper
  - platform: template
    name: "Fetch Spec"               # P4c: pull the BFF spec, parse into tiles, redraw (also bound to the Green button)
    id: fetch_spec
    on_press:
      - http_request.get:
          url: ${bff_base_url}/api/v1/sensors
          capture_response: true
          max_response_buffer_size: 24kB   # /api/v1/sensors ~10KB (16 sensors); default truncates it
          on_response:
            - lambda: |-
                ESP_LOGI("spec", "GET -> HTTP %d, %d bytes, %d ms",
                         response->status_code, body.length(), response->duration_ms);
                if (response->status_code != 200) return;
                id(g_tile_labels).clear();
                id(g_tile_lines).clear();
                bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                  for (JsonObject s : root["sensors"].as<JsonArray>()) {
                    if (id(g_tile_labels).size() >= 40) break;   // safety cap; buttons paginate the full set
                    const char *room = !s["room"].isNull() ? s["room"].as<const char *>()
                                                           : s["device_id"].as<const char *>();
                    JsonObject m = s["metrics"].as<JsonObject>();
                    std::string line;
                    int shown = 0;
                    for (JsonObject g : s["graphs"].as<JsonArray>()) {   // spec-driven: value + server precision + unit
                      if (shown >= 2) break;
                      const char *key = g["key"];
                      if (!key || m[key].isNull()) continue;
                      int prec = g["precision"] | 0;
                      const char *u = g["unit"] | "";
                      std::string unit;                                  // ASCII-strip for the mono font: "°C"->"C"
                      for (const char *p = u; *p; p++) if ((unsigned char) *p < 0x80) unit += *p;
                      float v = m[key].as<float>();
                      if (unit == "C") { v = v * 9.0f / 5.0f + 32.0f; unit = "F"; }   // C -> F
                      char fmt[8], val[16];
                      snprintf(fmt, sizeof(fmt), "%%.%df", prec);
                      snprintf(val, sizeof(val), fmt, v);
                      if (shown) line += "   ";
                      line += val;
                      if (!unit.empty()) { line += " "; line += unit; }
                      shown++;
                    }
                    if (line.empty()) line = "--";
                    id(g_tile_labels).push_back(room ? room : "?");
                    id(g_tile_lines).push_back(line);
                  }
                  return true;
                });
                ESP_LOGI("spec", "parsed %d tiles (ok=%d)", id(g_tile_labels).size(), ok);
      - http_request.get:                          # sibling (not nested): pull active alerts for the banner
          url: ${bff_base_url}/api/v1/alerts
          capture_response: true
          max_response_buffer_size: 8kB
          on_response:
            - lambda: |-
                id(g_alerts).clear();
                id(g_alert_crit) = false;
                json::parse_json(body, [](JsonObject root) -> bool {
                  for (JsonObject a : root["alerts"].as<JsonArray>()) {
                    if (id(g_alerts).size() >= 6) break;
                    const char *sev = a["severity"] | "";
                    const char *name = a["name"].isNull() ? (a["device_id"] | "?") : (a["name"] | "?");
                    const char *detail = a["detail"] | "";
                    if (std::string(sev) == "critical") id(g_alert_crit) = true;
                    std::string line = name;
                    if (detail[0]) { line += " - "; line += detail; }
                    id(g_alerts).push_back(line);
                  }
                  return true;
                });
                ESP_LOGI("spec", "parsed %d alerts (crit=%d)", id(g_alerts).size(), id(g_alert_crit));
            - component.update: epaper
  - platform: template
    name: "Test Sleep"               # P4e bisect: isolate the deep_sleep MECHANISM from the on_boot wake-cycle.
    on_press:                        # trigger over MQTT; device should drop offline then return after sleep_duration.
      - lambda: 'ESP_LOGW("sleep", "Test Sleep pressed -> allow+enter deep sleep now (%ds)", id(g_sleep_dur_s));'
      - deep_sleep.allow: ds
      - deep_sleep.enter:
          id: ds
          sleep_duration: !lambda 'return (uint32_t) id(g_sleep_dur_s) * 1000;'
  - platform: template
    name: "Test Alert"               # dev affordance: inject a fake critical alert to preview the banner
    on_press:
      - lambda: |-
          id(g_alerts).clear();
          id(g_alerts).push_back("TEST - low battery 8%");
          id(g_alert_crit) = true;
      - component.update: epaper
  # Edge-node test hooks: simulate a wall<->battery transition WITHOUT physically unplugging (HIZ won't fake it
  # — VBUS stays present in HIZ, so power_good stays ON, which is correct). Validates the envelope + the
  # coordinator's rebalance end-to-end. Does NOT touch g_edge_wall, so the next real transition still fires.
  - platform: template
    name: "Test Edge On-Battery"     # e1001-bench/button/test_edge_on_battery/command PRESS -> going-offline event
    on_press:
      - lambda: 'id(g_pub_wall) = false;'
      - script.execute: publish_edge_event
  - platform: template
    name: "Test Edge On-Wall"
    on_press:
      - lambda: 'id(g_pub_wall) = true;'
      - script.execute: publish_edge_event

